# El bot en vivo. Cada hora: lee precios reales, decide, simula las operaciones y guarda el estado.
# El estado (base de datos SQLite + dashboard.json) vive en la rama `bot-data`, separada del código,
# y la web lo lee directamente de ahí. Gratis en repositorios públicos.
name: Bot (ciclo horario, dinero ficticio)

on:
  schedule:
    - cron: "7 * * * *"      # minuto 7 de cada hora (UTC). GitHub puede retrasarlo de 5 a 30 min.
  workflow_dispatch:          # botón "Run workflow" en la pestaña Actions para lanzarlo a mano

permissions:
  contents: write             # para guardar el estado en la rama bot-data
  issues: write               # para avisar con un issue si salta el freno de emergencia

concurrency:
  group: bot                  # nunca dos ciclos a la vez sobre la misma cartera
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Descargar el estado (rama bot-data)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" bot-data >/dev/null; then
            git clone --depth 1 --branch bot-data "$URL" state
          else
            echo "Primera ejecución: se crea la rama bot-data y una cartera nueva."
            mkdir state && git -C state init -b bot-data && git -C state remote add origin "$URL"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Instalar dependencias
        run: pip install -r bot/requirements.txt

      - name: Ejecutar un ciclo del bot
        working-directory: bot
        run: python -m moneyprinter run --state ../state --alert-file ../ALERTA

      - name: Guardar el estado en bot-data
        working-directory: state
        run: |
          git config user.name "moneyprinter-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -f
          git commit -q -m "Ciclo $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4; do git push -q origin bot-data && exit 0; sleep $((i*5)); done
          exit 1

      - name: Avisar si ha saltado el freno de emergencia
        if: hashFiles('ALERTA') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Freno de emergencia activado" \
            --body "La cartera ficticia ha caído un 15 % o más desde su máximo. El bot ha dejado de abrir operaciones nuevas. Revisa el registro en la web. Para reactivarlo hace falta tu aprobación."

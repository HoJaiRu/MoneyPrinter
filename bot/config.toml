# Configuración del bot. Aquí NO van claves ni contraseñas (este archivo es público).
# Cualquier cambio de estrategia o de riesgo se hace aquí, con un commit, y solo con la aprobación de HoJaiRu.

[cartera]
capital_inicial = 50.0        # USD ficticios con los que arranca la cartera
moneda = "USD"
activo = true                 # false = el bot sigue leyendo precios pero no abre ni cierra nada (pausa)

[estrategia]
nombre = "rsi_rebote"         # archivo en bot/moneyprinter/strategies/ (estrategias intercambiables)
version = "v1.0"
temporalidad = "1h"           # velas de 1 hora

[estrategia.parametros]
rsi_periodo = 14
rsi_sobreventa = 30           # compra cuando el RSI vuelve a subir por encima de 30...
media_tendencia = 200         # ...solo si el precio está por encima de su media de 200 velas (tendencia de fondo alcista)
rsi_salida = 60               # vende cuando el RSI pasa de 60 (rebote completado); si no, actúa el stop-loss

# Alternativa probada en el backtest (no activa):
#   nombre = "cruce_medias"  con  rapida = 20, lenta = 50, rsi_periodo = 14, rsi_max_entrada = 70

[riesgo]
max_por_activo_pct = 30       # nunca más del 30 % de la cartera en un mismo activo (era 20 %; subido a petición de HoJaiRu el 14-nov-2026)
min_liquidez_pct = 10         # siempre al menos un 10 % en efectivo
freno_emergencia_pct = 40     # si cae un 40 % desde el máximo: no abre más operaciones y avisa (era 15 %; subido por HoJaiRu el 14-nov-2026)
comision_pct = 0.1            # comisión simulada por lado (compra y venta)
deslizamiento_pct = 0.05      # deslizamiento simulado por lado (precio algo peor que el visto)
orden_minima_usd = { acciones = 1.0, cripto = 5.0 }   # mínimos reales: fracciones de acción ~1 $, Binance 5 USDT

[agresividad]
actual = "maximo"

[[agresividad.niveles]]
id = "muy_prudente"
nombre = "Muy prudente"
tamano_pct = 10
stop_pct = 5
max_operaciones = 3
resumen = "Tres posiciones del 10 % con stop del 5 %. El nivel más tranquilo, y aun así más cargado que antes."

[[agresividad.niveles]]
id = "prudente"
nombre = "Prudente"
tamano_pct = 15
stop_pct = 8
max_operaciones = 4
resumen = "Hasta 4 posiciones del 15 % con stop del 8 %."

[[agresividad.niveles]]
id = "equilibrado"
nombre = "Equilibrado"
tamano_pct = 20
stop_pct = 10
max_operaciones = 4
resumen = "Hasta 4 posiciones del 20 % con stop del 10 %."

[[agresividad.niveles]]
id = "agresivo"
nombre = "Agresivo"
tamano_pct = 25
stop_pct = 12
max_operaciones = 3
resumen = "Hasta 3 posiciones del 25 % con stop del 12 %."

[[agresividad.niveles]]
id = "maximo"
nombre = "Máximo"
tamano_pct = 30
stop_pct = 15
max_operaciones = 3
resumen = "Tres posiciones del 30 % (90 % invertido, el tope) con stop del 15 %. Es el nivel con el que opera el bot. Tres stops seguidos rozan el freno de emergencia."

[estudio]
# Estudio a fondo de cada activo hecho por Claude (fuera del bot: el código sigue sin llevar IA).
# Claude lo escribe en research/estudio.json y el bot lo descarga en cada ciclo.
#  - Cuando hay señal de compra o de venta, el bot NO opera todavía: deja la operación "en espera" y
#    Claude la estudia en su siguiente revisión (cada hora). Solo se ejecuta con un estudio de ese activo
#    de menos de `frescura_min` minutos. Veredicto "evitar" = no se compra. Salida "mantener" = no se vende.
#  - Una venta espera como mucho `espera_venta_min`; si no llega estudio, se vende igualmente.
#  - El stop-loss no espera nunca.
#  - Si Claude lleva más de `validez_horas` sin escribir nada, el bot opera solo con el filtro de titulares.
activo = true
url = "https://raw.githubusercontent.com/HoJaiRu/MoneyPrinter/claude/project-thread-dktsei/research/estudio.json"
validez_horas = 30
frescura_min = 75
espera_venta_min = 70

[noticias]
activo = true                 # respaldo: titulares de Yahoo Finance si no hay estudio reciente
horas = 24                    # solo cuentan los titulares de las últimas 24 horas
max_negativos = 2             # con 2 o más titulares negativos (y más negativos que positivos) NO se compra

[universo]
acciones = ["AAPL", "MSFT", "NVDA", "AMZN", "GOOGL"]   # Yahoo Finance
cripto = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]             # Binance (pares contra USDT ≈ USD)

[referencia]
simbolo = "SPY"
nombre = "S&P 500 (comprar y mantener)"
